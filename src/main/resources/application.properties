spring.application.name=banking-operations-system
server.address=127.0.0.1
server.port=8080
spring.jackson.deserialization.accept-float-as-int=false

# Archivo persistente relativo a la carpeta desde la que arrancas la aplicación.
spring.datasource.url=jdbc:h2:file:./data/banco
spring.datasource.username=sa
spring.datasource.password=
# Flyway crea y actualiza el esquema (db/migration) y carga los datos de demostración
# (db/demo). En un despliegue real se dejaría solo db/migration.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# Umbral de demostración: solo las transferencias EUR estrictamente mayores lo activan.
banco.deteccion.umbral-eur=50.00

# Clave para firmar los JWT. En producción se pasa por la variable de entorno
# JWT_SECRET; este valor por defecto es solo para desarrollo local.
banco.jwt.secret=${JWT_SECRET:clave-de-desarrollo-solo-local-cambiar-en-produccion-1234567890}
# Caducidad del token en milisegundos (3600000 = 1 hora).
banco.jwt.expiracion-ms=3600000
